[package]
name = "rusty_list"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Anthony Tropeano <anthonytropeano@me.com>"]
license ="MIT"
description = "A no_std compatible, intrusive doubly linked list implementation."
readme = "README.md"
repository = "https://github.com/iiTONELOC/rusty_list"
keywords = ["no_std", "linked-list", "intrusive", "embedded", "kernel"]
